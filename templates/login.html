<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — CleverFund</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
          },
          boxShadow: { soft: '0 4px 24px -4px rgba(37, 99, 235, 0.12)' }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <div class="flex min-h-screen flex-col lg:flex-row">
    <!-- Brand panel -->
    <div class="relative flex flex-1 flex-col justify-between bg-gradient-to-br from-brand-600 via-brand-700 to-slate-900 px-8 py-12 text-white lg:max-w-md">
      <div class="login-brand">
        <div class="flex items-center gap-3">
          <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-white/15 text-lg font-bold shadow-lg backdrop-blur">
            C
          </div>
          <span class="text-xl font-semibold tracking-tight">CleverFund</span>
        </div>
        <div class="mt-16 max-w-sm">
          <h1 class="text-3xl font-bold leading-tight">Predict startup success with confidence.</h1>
          <p class="mt-4 text-sm text-brand-100/90">
            Sign in to access your dashboard, run predictions, and explore analytics.
          </p>
        </div>
      </div>
      <p class="text-xs text-brand-200/80">© 2025 CleverFund</p>
    </div>

    <!-- Form -->
    <div class="flex flex-1 items-center justify-center px-4 py-12 sm:px-8">
      <div class="login-card w-full max-w-md rounded-2xl border border-slate-100 bg-white p-8 shadow-soft">
        <h2 class="text-xl font-bold text-slate-900">Welcome back</h2>
        <p class="mt-1 text-sm text-slate-500">Enter your credentials to continue.</p>

        {% if error %}
        <div class="mt-4 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-800" role="alert">
          {{ error }}
        </div>
        {% endif %}

        <form method="post" action="{{ url_for('login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') | urlencode }}{% endif %}" class="mt-6 space-y-4">
          <div>
            <label for="email" class="mb-1 block text-sm font-medium text-slate-700">Email</label>
            <input
              id="email"
              name="email"
              type="text"
              autocomplete="username"
              required
              class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20"
              placeholder="you@company.com"
            />
          </div>
          <div>
            <label for="password" class="mb-1 block text-sm font-medium text-slate-700">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20"
              placeholder="••••••••"
            />
          </div>
          <button
            type="submit"
            class="w-full rounded-xl bg-brand-600 py-2.5 text-sm font-semibold text-white shadow-md transition hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2"
          >
            Sign in
          </button>
        </form>

        <p class="mt-6 rounded-xl bg-slate-50 px-3 py-2 text-xs text-slate-600">
          Any email and password will sign you in.
        </p>
      </div>
    </div>
  </div>
</body>
</html>
